<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<title>{% block title %}ply面板{% endblock %}</title>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/pico.fluid.classless.blue.min.css') }}"
		/>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/main.css') }}"
		/>
		<link
			rel = "javascript"
			href = "{{ url_for('static', filename='js/htmx.min.js') }}"
		/>
	</head>

	<body>
		<header>
			<h1>ply面板</h1>
			<nav>
				<a href="/">首页</a> |
				<a href="/about">关于</a>
			</nav>
		</header>

		<main>
			<!-- block 是占位区域，子模板可以填充或覆盖 -->
			{% block content %}{% endblock %}
		</main>

		<footer>
			<p>&copy; war</p>
		</footer>
	</body>
</html>
