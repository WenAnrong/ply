<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<title>{% block title %}ply面板{% endblock %}</title>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/main.css') }}"
		/>
		<script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
	</head>

	<body>
		<div class="layout">
			<!-- ===== 侧边栏 ===== -->
			<aside class="sidebar" id="sidebar">
				<div class="sidebar-brand">
					<a href="{{ url_for('dashboard.index') }}" class="brand-link">
						<span class="brand-mark">ply</span>
						<span class="brand-name">ply面板</span>
					</a>
				</div>

				<nav class="sidebar-nav">
					<section class="nav-section">
						<span class="nav-section-title">概览</span>
						<a href="{{ url_for('dashboard.index') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
							<span class="nav-ico">
								<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
							</span>
							<span>仪表盘</span>
						</a>
					</section>

					<section class="nav-section">
						<span class="nav-section-title">系统</span>
						<a href="{{ url_for('about.index') }}" class="nav-link {% if request.path == '/about' %}active{% endif %}">
							<span class="nav-ico">
								<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
							</span>
							<span>关于</span>
						</a>
					</section>
				</nav>

			</aside>

			<!-- ===== 右侧内容区 ===== -->
			<div class="content">
				<header class="topbar">
					<button
						class="menu-toggle"
						id="menuToggle"
						type="button"
						aria-label="切换菜单"
						aria-expanded="false"
					>
						<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
					</button>
					<h1 class="topbar-title">{% block page_title %}ply面板{% endblock %}</h1>
					<div class="topbar-actions">
						<span class="user-badge">W</span>
					</div>
				</header>

				<main class="main">
					{% block content %}{% endblock %}
				</main>
				<footer class="footer">
					<p>&copy; {{ now_year }} war · ply 服务器面板</p>
				</footer>
			</div>
		</div>

		<!-- 移动端侧边栏遮罩 -->
		<div class="sidebar-mask" id="sidebarMask"></div>

		<script>
			const toggle = document.getElementById("menuToggle");
			const sidebar = document.getElementById("sidebar");
			const mask = document.getElementById("sidebarMask");

			function closeSidebar() {
				sidebar.classList.remove("open");
				mask.classList.remove("show");
				toggle.setAttribute("aria-expanded", "false");
			}

			toggle.addEventListener("click", () => {
				const open = sidebar.classList.toggle("open");
				mask.classList.toggle("show", open);
				toggle.setAttribute("aria-expanded", open ? "true" : "false");
			});

			mask.addEventListener("click", closeSidebar);
			document.querySelectorAll(".nav-link").forEach((link) =>
				link.addEventListener("click", closeSidebar)
			);
		</script>

		{% block scripts %}{% endblock %}
	</body>
</html>
