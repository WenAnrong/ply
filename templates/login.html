<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>登录 · ply面板</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
	</head>

	<body class="auth-body">
		<div class="auth-wrap">
			<div class="auth-card">
				<div class="auth-brand">
					<span class="brand-mark">ply</span>
					<span class="brand-name">ply面板</span>
				</div>
				<p class="auth-subtitle">登录服务器管理面板</p>

				{% with messages = get_flashed_messages(with_categories=true) %}
					{% if messages %}
						{% for category, message in messages %}
							<div class="alert alert-{{ category }}">{{ message }}</div>
						{% endfor %}
					{% endif %}
				{% endwith %}

				<form class="auth-form" method="post" action="{{ url_for('auth.login') }}" novalidate>
					<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

					<div class="form-group">
						<label for="username">用户名</label>
						<input
							type="text"
							id="username"
							name="username"
							placeholder="请输入用户名"
							autocomplete="username"
							required
						/>
					</div>

					<div class="form-group">
						<label for="password">密码</label>
						<input
							type="password"
							id="password"
							name="password"
							placeholder="请输入密码"
							autocomplete="current-password"
							required
						/>
					</div>

					<div class="form-row">
						<label class="checkbox">
							<input type="checkbox" name="remember" id="remember" />
							<span>记住我</span>
						</label>
					</div>

					<button type="submit" class="btn btn-primary auth-submit">登 录</button>
				</form>

				<p class="auth-switch">还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
			</div>

			<p class="auth-footer">&copy; {{ now_year }} war · ply 服务器面板</p>
		</div>
	</body>
</html>
