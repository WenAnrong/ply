<div class="panel">
	<div class="panel-header">docker配置文件</div>
	<div class="panel-body">
		{% if docker_config_error %}
			<div class="alert alert-error">{{ docker_config_error }}</div>
		{% endif %}

		<p class="page-subtitle">
			{{ docker_config_path }}{% if not docker_config_exists %}（文件不存在，保存时将新建）{% endif %}
			· 保存后将自动重启 Docker
		</p>

		<form method="post" action="{{ url_for('docker.save_docker_config') }}" novalidate>
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
			<textarea
				name="content"
				id="docker-config-editor"
				spellcheck="false"
				rows="10"
				class="code-editor"
			>{{ docker_config }}</textarea>
			<div class="form-actions">
				<button type="submit" class="btn btn-primary" id="save-docker-config">保存并重启 Docker</button>
			</div>
		</form>
	</div>
</div>


<script>
	(function () {
		var textarea = document.getElementById("docker-config-editor");
		if (!textarea) return;

		var editor = CodeMirror.fromTextArea(textarea, {
			mode: "application/json",
			lineNumbers: true,
			lineWrapping: true,
			matchBrackets: true,
			autoCloseBrackets: true,
			lint: true,
			indentUnit: 2,
			tabSize: 2,
			extraKeys: { "Ctrl-S": function () { textarea.form.requestSubmit(); } }
		});
		editor.setSize("100%", 320);

		var form = textarea.form;
		form.addEventListener("submit", function (e) {
			editor.save();
			if (!confirm("保存后将重启 Docker，确认继续？")) {
				e.preventDefault();
			}
		});
	})();
</script>
