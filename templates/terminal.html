{% extends "base.html" %}

{% block title %}终端 · ply面板{% endblock %}

{% block page_title %}终端{% endblock %}

{% block content %}
	<div class="terminal-page">
		<!-- 终端上方工具栏：右侧字体缩放 -->
		<div class="terminal-toolbar">
			<div class="toolbar-right">
				<button id="fontMinus" class="btn toolbar-icon" type="button" title="缩小字体">−</button>
				<span id="fontSizeLabel" class="font-size-label">14px</span>
				<button id="fontPlus" class="btn toolbar-icon" type="button" title="放大字体">＋</button>
			</div>
		</div>

		<!-- 黑色终端框：进入即像 tty 一样弹出登录提示 -->
		<div class="terminal-shell">
			<div id="terminal" class="terminal-box"></div>
		</div>
	</div>
{% endblock %}

{% block scripts %}
	<link
		rel="stylesheet"
		href="{{ url_for('static', filename='js/xterm/xterm.css') }}"
	/>
	<script src="{{ url_for('static', filename='js/xterm/xterm.js') }}"></script>
	<script src="{{ url_for('static', filename='js/xterm/addon-fit.js') }}"></script>
	<script src="{{ url_for('static', filename='js/xterm/addon-webgl.js') }}"></script>
	<script src="{{ url_for('static', filename='js/xterm/addon-canvas.js') }}"></script>

	<script>
		// IIFE（立即执行函数）：把变量都包在局部作用域里，避免污染全局
		(function () {
			"use strict";

			// ===== 从页面 DOM 中取出需要用到的元素 =====
			var fontPlus = document.getElementById("fontPlus"); // 放大字体按钮
			var fontMinus = document.getElementById("fontMinus"); // 缩小字体按钮
			var fontSizeLabel = document.getElementById("fontSizeLabel"); // 显示当前字号

			// ===== 全局状态变量 =====
			var term = null; // xterm.js 终端实例
			var fitAddon = null; // 自动适配容器大小的插件
			var socket = null; // 与后端通信的 WebSocket
			var fontSize = 14; // 当前字号（默认 14px）
			var MIN_FONT = 10; // 字号下限
			var MAX_FONT = 28; // 字号上限

			// 把当前终端行列数通过 WebSocket 通知后端，让 PTY 同步窗口大小
			function sendResize() {
				if (
					socket &&
					socket.readyState === WebSocket.OPEN && // 连接还没建立成功就不发
					term
				) {
					socket.send(
						JSON.stringify({
							type: "resize", // 消息类型：控制指令
							cols: term.cols, // 当前列数
							rows: term.rows, // 当前行数
						})
					);
				}
			}

			// 应用字号：更新终端、标签、重新适配布局，并通知后端 resize
			function applyFontSize() {
				if (term) {
					term.options.fontSize = fontSize; // 修改 xterm 字号
					fontSizeLabel.textContent = fontSize + "px"; // 更新界面文字
					if (fitAddon) {
						fitAddon.fit(); // 重新计算终端占满容器
					}
					sendResize(); // 同步新的行列数给后端
					term.focus(); // 保持焦点，方便继续输入
				}
			}

			// 防抖：把窗口/容器频繁的 resize 收敛成最后一次（约 120ms），
			// 避免拖动窗口/侧栏切换时每帧都 fit() + sendResize() 造成卡顿和刷屏
			var fitTimer = null;
			function debouncedFit() {
				clearTimeout(fitTimer);
				fitTimer = setTimeout(function () {
					if (fitAddon) {
						fitAddon.fit();
					}
					sendResize();
				}, 120);
			}

			// 根据当前页面协议（http/https）拼出对应的 WebSocket 地址
			var wsUrl =
				(location.protocol === "https:" ? "wss://" : "ws://") +
				location.host +
				"/terminal/ws";

			// 启动终端（进入页面即调用，像 tty 一样弹出登录提示）
			function startTerminal() {
				// 创建 xterm.js 终端实例，配置外观与行为
				term = new Terminal({
					cursorBlink: true, // 光标闪烁
					convertEol: true, // 把 \n 自动转为 \r\n，避免换行错乱
					fontFamily:
						'"JetBrainsMonoNF", "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace',
					fontSize: fontSize, // 初始字号
					lineHeight: 1.2, // 行高
					scrollback: 5000, // 保留 5000 行历史回滚
					theme: {
						background: "#0b0e14",
						foreground: "#e6e6e6",
						cursor: "#e6e6e6",
					},
				});

				// 加载“自适应”插件：让终端大小跟随容器
				fitAddon = new FitAddon.FitAddon();
				term.loadAddon(fitAddon);
				term.open(document.getElementById("terminal")); // 挂载到页面的 #terminal 元素
				fitAddon.fit(); // 立即按当前容器大小适配

				// 渲染加速：优先 WebGL（用浏览器 GPU 绘制，刷屏/滚动更流畅），
				// 不支持或失败时回退 Canvas，最后兜底 xterm 默认的 DOM 渲染器。
				// 注意：渲染插件需在 term.open() 之后加载（要基于已挂载的 DOM 创建 canvas）；
				//      UMD 版 addon 暴露的是命名空间对象（WebglAddon.WebglAddon / CanvasAddon.CanvasAddon）。
				var accelerated = false;
				if (
					typeof WebglAddon !== "undefined" &&
					typeof WebglAddon.WebglAddon === "function"
				) {
					try {
						var webglAddon = new WebglAddon.WebglAddon();
						webglAddon.onContextLoss(function () {
							// GPU 上下文丢失（如切换显卡/长时间后台）时仅记录，
							// 插件会自动退回非 WebGL 渲染，不影响使用
							console.warn("[terminal] WebGL 上下文丢失，已回退渲染");
						});
						term.loadAddon(webglAddon);
						accelerated = true;
					} catch (e) {
						accelerated = false;
					}
				}
				if (
					!accelerated &&
					typeof CanvasAddon !== "undefined" &&
					typeof CanvasAddon.CanvasAddon === "function"
				) {
					try {
						term.loadAddon(new CanvasAddon.CanvasAddon());
					} catch (e) {
						// WebGL 与 Canvas 都不可用：继续用默认 DOM 渲染器
					}
				}

				// 建立 WebSocket 连接到后端
				socket = new WebSocket(wsUrl);

				// 连接建立成功：先同步一次窗口尺寸，并让终端获得焦点
				socket.onopen = function () {
					sendResize();
					term.focus();
				};

				// 收到后端数据（终端输出）：直接写入 xterm 显示
				socket.onmessage = function (ev) {
					term.write(ev.data);
				};

				// 连接断开：在终端里输出黄色提示
				socket.onclose = function () {
					term.write("\r\n\x1b[33m[连接已断开]\x1b[0m\r\n");
				};

				// 连接出错：在终端里输出红色提示
				socket.onerror = function () {
					term.write("\r\n\x1b[31m[连接出错]\x1b[0m\r\n");
				};

				// 用户敲键盘/粘贴输入：通过 WebSocket 发给后端写入 PTY
				term.onData(function (data) {
					if (socket && socket.readyState === WebSocket.OPEN) {
						socket.send(data);
					}
				});

				// 终端尺寸变化（如点击字号按钮 fit 后触发）：同步给后端
				term.onResize(function () {
					sendResize();
				});

				// 浏览器窗口缩放：防抖后重新适配并同步尺寸（避免拖动时高频触发）
				window.addEventListener("resize", debouncedFit);
			}

			// 进入页面即启动终端（像 tty 一样）
			startTerminal();

			// 放大字体按钮：不超过上限
			fontPlus.addEventListener("click", function () {
				if (fontSize < MAX_FONT) {
					fontSize += 1;
					applyFontSize();
				}
			});

			// 缩小字体按钮：不低于下限
			fontMinus.addEventListener("click", function () {
				if (fontSize > MIN_FONT) {
					fontSize -= 1;
					applyFontSize();
				}
			});
		})();
	</script>
{% endblock %}
